# Secrets Scan with gitleaks
name: Secrets Scan

on:
  workflow_call:

jobs:
  secrets_scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets with gitleaks 
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

