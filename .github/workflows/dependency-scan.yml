# dependency means requirements.txt scan 
# with --> pip-audit

name: Dependency scan

on:
  workflow_call:

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      
      - name: Run pip audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt