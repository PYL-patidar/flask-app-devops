name: Build and push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Login to docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: docker build and deploy
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{vars.DOCKERHUB_USER}}/flaskapp:latest
            ${{vars.DOCKERHUB_USER}}/flaskapp:${{ github.ref_name }}
            ${{vars.DOCKERHUB_USER}}/flaskapp:${{ github.sha }}
    