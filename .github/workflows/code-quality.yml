# This is for Code quality check like syntex 
# with python specific --> flake8 
name: Code Quality

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  pyhton-linter:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: install linting tool
        run: | 
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Run linter
        run: flake8