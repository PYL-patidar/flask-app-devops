# name of workflow
name: pyhton lint 

# set trigger point
on:
  push:
    branches: [main]
  workflow_dispatch:

# put actual action inside jod and steps
jobs:
  linter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup the pyhton 
        uses: actions/setup-python@v4
        with:
          pyhton_version: ${{ matrix.pyhton_version }}

      - name: install requirements
        run: pip install -r requirements.txt

      - name: flake8 linting
        run: flake8 run.py

