# security credentials scan like API keys, github tokens, aws keys
# secrets scan with --> gitleaks

name: Secrets scan

on:
  workflow_call:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout 
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0
      
      - name: gitleaks secres scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}